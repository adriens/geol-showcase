version: '3'

tasks:
  default:
    cmds:
      - task: build
      - task: to-jpeg

  build:
    desc: "Build the LaTeX report into a PDF using xelatex"
    deps:
      - update-history
    cmds:
      - mkdir -p dist
      - xelatex -output-directory=dist rapport_postgresql_EN.tex
      - xelatex -output-directory=dist rapport_postgresql_EN.tex
      - rm -f dist/*.aux dist/*.log dist/*.out dist/*.toc

  update-history:
    desc: "Update vulnerability history CSV using uv and trivy"
    cmds:
      - uv run src/update_history.py
    sources:
      - src/update_history.py
    generates:
      - data/vulnerability_history.csv

  clean:
    desc: "Clean up all generated build outputs"
    cmds:
      - rm -rf dist

  to-jpeg:
    desc: "Convert the PDF report to JPEG images"
    deps:
      - build
    cmds:
      - mkdir -p dist/img
      - pdftoppm -jpeg dist/rapport_postgresql_EN.pdf dist/img/rapport_postgresql_EN
